# ==========================================
# ПРИОРИТЕТНЫЕ НАСТРОЙКИ (идут ПЕРЕД загрузкой базового скрипта)
# ==========================================

# Явно указываем протокол (это решит вашу главную ошибку)
transport select jtag

# Отключаем проверку ID (если прошивка уже стерта или отличается от стандарта)
set CPUTAPID 0

# ==========================================
# ЗАГРУЗКА БАЗОВОГО КОНФИГА (для STM32F103 и т.д.)
# ==========================================
source [find target/stm32f1x.cfg]

# ==========================================
# НАСТРОЙКИ СКОРОСТИ И СБРОСА
# ==========================================
# Оптимальная скорость (для ST-Link V2 - 1000-2000, для V1 - 950-1000)
adapter speed 950

# Важно: Режим сброса "без физического пина RESET"
# Если у вас RESET не подключен к ST-Link, это единственный рабочий вариант
reset_config none
cortex_m reset_config sysresetreq

# ==========================================
# ОБРАБОТЧИК ПОДКЛЮЧЕНИЯ GDB
# ==========================================
$_TARGETNAME configure -event gdb-attach {
    echo "GDB attaching to target..."
    
    # Пытаемся остановить ядро. Если не выходит - пробуем сброс
    if {[catch {halt}]} {
        echo "WARNING: Could not halt target. Trying reset..."
        reset init
    }
    
    sleep 200
    
    # Финальная проверка остановки
    if {[catch {halt}]} {
        echo "ERROR: Target still not halted. Trying hard reset..."
        reset halt
    }
    
    echo "GDB attach completed"
}

# Заглушка, чтобы не было ошибок от стандартных скриптов
proc gdb_attach_hook {} {
    echo "Custom gdb_attach_hook: doing nothing, handled by event"
}